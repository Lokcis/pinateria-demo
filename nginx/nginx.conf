# nginx para Piñatería Demo.
#
# Sirve el frontend (frontend/dist) y reenvía /api/ al backend FastAPI
# quitando el prefijo: /api/login -> backend:8000/login. El TLS lo termina
# Cloudflare Tunnel, por eso aquí solo se escucha en el puerto 8080 (sin privilegios;
# docker-compose.yml lo publica únicamente en 127.0.0.1).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip para que la PWA cargue rápido en redes móviles.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Detrás de Cloudflare el esquema real llega en X-Forwarded-Proto.
    map $http_x_forwarded_proto $esquema_publico {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Visitante real del autorregistro: detrás del túnel, Cloudflare manda su dirección en
    # Cf-Connecting-Ip (Nginx solo se alcanza por el túnel o desde 127.0.0.1, así que la cabecera
    # no la pone el visitante). Si no viene, se usa la dirección de la conexión.
    map $http_cf_connecting_ip $visitante {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    # Límite de envíos del formulario público de autorregistro (RF-049): 6 por minuto por visitante.
    limit_req_zone $visitante zone=autoregistro:10m rate=6r/m;

    upstream fastapi_backend {
        server backend:8000;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 2m;

        # Endpoints públicos (sin sesión) del autorregistro: con límite de peticiones por visitante.
        # Responde 429 al pasarse. La barra final de proxy_pass quita el prefijo /api, como abajo.
        location /api/publico/ {
            limit_req zone=autoregistro burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://fastapi_backend/publico/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $visitante;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $esquema_publico;

            proxy_read_timeout 30;
            proxy_connect_timeout 10;
            proxy_send_timeout 30;
            client_max_body_size 16k;
        }

        # API: se quita el prefijo /api (la barra final de proxy_pass lo hace).
        location /api/ {
            proxy_pass http://fastapi_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $esquema_publico;

            proxy_read_timeout 90;
            proxy_connect_timeout 10;
            proxy_send_timeout 90;
        }

        # Archivos con hash en el nombre (Vite): cachear un año.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA: cualquier ruta del frontend cae en index.html, sin cachear para
        # que un despliegue nuevo se vea al recargar.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "same-origin" always;
        }
    }
}
