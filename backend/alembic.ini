[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# La URL real se inyecta en tiempo de ejecucion desde app.core.config.settings
# (ver alembic/env.py). Este valor es solo un placeholder para que el
# archivo sea valido por si se invoca alembic sin pasar por env.py.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
